name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test
